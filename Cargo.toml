[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/tay-term/tay"

[workspace.dependencies]
tay-config = { path = "crates/tay-config" }
tay-window = { path = "crates/tay-window" }
tay-render = { path = "crates/tay-render" }

alacritty_terminal = "0.26"
winit = "0.31.0-beta.3"
glyphon = "0.12"
arboard = "3.7"
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
