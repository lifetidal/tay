[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/tay-term/tay"

[workspace.dependencies]
tay-config = { path = "crates/tay-config" }
tay-window = { path = "crates/tay-window" }
tay-render = { path = "crates/tay-render" }

alacritty_terminal = "0.26"
glyphon = "0.12"
wayland-client = { version = "0.31.15", features = ["system"] }
sctk = { package = "smithay-client-toolkit", version = "0.21.1" }
wayland-protocols-wlr = "0.3.12"
wayland-protocols = "0.32.13"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
zbus = "5"
async-io = "2"
arboard = { version = "3.7", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
