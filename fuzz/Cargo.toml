[package]
name = "tay-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# 独立 workspace:脱离父 workspace,避免 `cargo test/build --workspace`
# 波及 fuzz target。
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
tayd = { path = "../crates/tayd", features = ["fuzzing"] }

[[bin]]
name = "parser_bytes"
path = "fuzz_targets/parser_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sixel_dcs"
path = "fuzz_targets/sixel_dcs.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
