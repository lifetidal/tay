[package]
name = "tayd"
description = "Tay daemon:PTY + alacritty_terminal 内核 + 窗口/渲染接线"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tayd"
path = "src/main.rs"

[lib]
name = "tayd"
path = "src/lib.rs"

[features]
fuzzing = []

[dev-dependencies]
proptest = "1"

[dependencies]
tay-config.workspace = true
tay-window.workspace = true
tay-render.workspace = true
alacritty_terminal.workspace = true
arboard.workspace = true
unicode-width = "0.2"
ashpd.workspace = true
zbus.workspace = true
async-io.workspace = true
futures-lite = "2"
polling = "3"
libc = "0.2"
signal-hook = "0.4"
regex = "1"
notify = "8"
base64 = "0.22"
image = { workspace = true, features = ["png"] }
serde = { workspace = true }
toml.workspace = true
dirs.workspace = true
log.workspace = true
env_logger.workspace = true
icy_sixel = "0.7.0"
